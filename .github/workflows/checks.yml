name: Vérifications
on: [push, pull_request]
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/check_publication.py
      - run: python -m pip install -r requirements-lock.txt
      - run: python -m pytest -m "not data" -q
